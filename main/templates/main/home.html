<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(rgb(255, 255, 255), rgb(0, 0, 0));
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    .title {
      color: #5C6AC4;
      
    }
    .container {
      max-height: 8em;
      max-width: 800px;
      margin: 10em 10% 30% 20%;
    }
    .header {
        background: radial-gradient(rgb(164, 156, 156),rgb(97, 97, 104));
        color: white;
        padding: 25px;
        border-radius: 18px;
        text-align: center;
        margin-bottom: 25px;
        box-shadow: 0 8px 20px rgba(0, 119, 182, 0.2);
    }
    .student-card {
        display: flex;
        background: white;
        border: 0.3rem gray solid;
        border-radius: 18px;
        padding: 0 0 0 20px;
        margin: 10px 0 10px 0;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 5px 15px rgba(0, 119, 182, 0.12);
        transition: 0.3s;
    }
    .student-number {
      
        display: flex;
        background: radial-gradient(rgb(164, 156, 156),rgb(97, 97, 104));
        color: white;
        width: 45px;
        height: 45px;
        padding: 0 0 0 0px;
        margin: 10px 10px 10px 0;
        border-radius: 30%;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
    }
    .student-info {
      display: grid;
        grid-auto-flow: column;
        align-items: center;
      padding: 0 0 0 20px;
      gap: 1rem;
    }
    </style>
  </head>
  <body>
    <div class="container">

        <div class="header">
            <h1>Student List</h1>
        </div>

        <div class="student-card">
            <div class="student-info">
                <h2>Gerald Palacio</h2>
                <p><span class="label">Course:</span> BSIT</p>
                <p><span class="label">Age:</span> 21</p>
            </div>
            <div class="student-number">01</div>
        </div>

        <div class="student-card">
            <div class="student-info">
                <h2>Ann Geslyn</h2>
                <p><span class="label">Course:</span> BSIT</p>
                <p><span class="label">Age:</span> 21</p>
            </div>
            <div class="student-number">02</div>
        </div>

        <div class="student-card">
            <div class="student-info">
                <h2>Jasten Palacio</h2>
                <p><span class="label">Course:</span> BSIT</p>
                <p><span class="label">Age:</span> 25</p>
            </div>
            <div class="student-number">03</div>
        </div>

    </div>
  </body>
</html>
